name: Migrate database

# Applies src/lib/db/schema.sql to production whenever it changes on main,
# so a schema change ships without a manual `pnpm db:migrate` from a machine
# that happens to have DATABASE_URL. Every statement in that file is written
# to be safe to re-run (see its own header comment), so running this on every
# push that touches it — not just the push that first added a statement — is
# intentional, not wasteful: a merge, a revert, or a hotfix branch all still
# end up migrated correctly with no extra bookkeeping about what already ran.
#
# DATABASE_URL itself is not a secret set here — it's pulled at run time from
# the env-vault (project "project-x"), the same source local dev and the
# deployed app use, so rotating it never means updating a GitHub secret too.
# The only thing this repo needs is ENV_VAULT_TOKEN (Settings -> Secrets and
# variables -> Actions -> New repository secret, value from the vault
# dashboard's Usage panel). Nothing here can run without it — the job fails
# loudly rather than silently skipping, since a schema change deployed
# without its migration is exactly the failure mode this exists to prevent.

on:
  push:
    branches: [main]
    paths:
      - "src/lib/db/schema.sql"
  workflow_dispatch: {}

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install envvault
        run: |
          curl -fsS https://env-vault-api.alexdev93.workers.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure envvault
        run: |
          mkdir -p ~/.config/env-vault
          printf "ENV_VAULT_URL='https://env-vault-api.alexdev93.workers.dev'\nENV_VAULT_TOKEN='%s'\n" \
            "$ENV_VAULT_TOKEN" > ~/.config/env-vault/config
          chmod 600 ~/.config/env-vault/config
        env:
          ENV_VAULT_TOKEN: ${{ secrets.ENV_VAULT_TOKEN }}

      - name: Apply schema.sql
        # `pnpm db:migrate` already wraps itself with `envvault run project-x
        # --` (see package.json) — same command as running it by hand.
        run: pnpm db:migrate
